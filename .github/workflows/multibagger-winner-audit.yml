name: Multibagger Winner Audit
on:
  push:
    branches: [main]
    paths: ["multibagger/**", "core/initial_scanners.py", "scripts/run_winner_audit.py", ".github/workflows/multibagger-winner-audit.yml"]
  workflow_dispatch:
concurrency:
  group: multibagger-winner-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_winner_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-winner-audit
          path: reports/multibagger-winner-audit.json
