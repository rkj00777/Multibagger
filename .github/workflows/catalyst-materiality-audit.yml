name: MBE Catalyst Materiality Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/catalyst.py"
      - "scripts/run_catalyst_materiality_audit.py"
      - "tests/test_catalyst_materiality.py"
      - ".github/workflows/catalyst-materiality-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_catalyst_materiality.py' -v
      - name: Audit previously provided benchmark names
        run: PYTHONPATH=. python scripts/run_catalyst_materiality_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbe-catalyst-materiality-audit
          path: reports/catalyst-materiality-audit.json
