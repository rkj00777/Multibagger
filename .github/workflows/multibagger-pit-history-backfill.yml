name: Multibagger PIT History Backfill

on:
  push:
    paths:
      - ".github/workflows/multibagger-pit-history-backfill.yml"
      - "scripts/backfill_pit_history.py"
      - "core/nse_pit.py"
      - "core/market_data.py"
  workflow_dispatch:

concurrency:
  group: multibagger-pit-history-backfill
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backfill-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill historical PIT evidence from free NSE filings
        env:
          PIT_WORKERS: "6"
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/backfill_pit_history.py --top-n 100 --workers 6

      - name: Persist timestamped PIT evidence
        run: |
          git config user.name "multibagger-bot"
          git config user.email "multibagger-bot@users.noreply.github.com"
          git add data/pit reports/multibagger-pit-history-backfill.json
          if git diff --cached --quiet; then
            echo "No new PIT evidence."
          else
            git commit -m "Backfill timestamped NSE PIT history for walk-forward validation"
            git push
          fi

      - name: Run walk-forward validation on archived PIT facts
        env:
          VALIDATION_MONTHS: "2022-03-31,2022-06-30,2022-09-30,2022-12-30,2023-03-31,2023-06-30,2023-09-29,2023-12-29,2024-03-28,2024-06-28,2024-09-30,2024-12-30,2025-03-31,2025-06-30,2025-09-30,2025-12-31"
          MBE_ENABLE_DYNAMIC_PIT_FALLBACK: "0"
        run: |
          PYTHONPATH=. python scripts/run_validation.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibagger-pit-history-validation
          path: |
            reports/multibagger-pit-history-backfill.json
            reports/multibagger-pit-validation.json
            data/pit/manifest.json
