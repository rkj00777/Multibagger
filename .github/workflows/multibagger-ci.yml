name: Multibagger CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m py_compile core/*.py multibagger/*.py scripts/*.py
      - name: Run unit smoke tests
        run: |
          python - <<'PY'
          from core.pit_store import coverage
          import pandas as pd
          assert coverage(pd.DataFrame())["facts"] == 0
          from core.nse_pit import NSEPIT
          assert callable(NSEPIT)
          print("PIT foundation smoke test: PASS")
          PY
