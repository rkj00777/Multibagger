name: Multibagger CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m py_compile core/*.py multibagger/*.py scripts/*.py
      - name: Execute live Multibagger scan
        run: PYTHONPATH=. python scripts/run_live.py
      - name: Upload live scan
        uses: actions/upload-artifact@v4
        with:
          name: multibagger-live-report
          path: reports/multibagger-live.json
