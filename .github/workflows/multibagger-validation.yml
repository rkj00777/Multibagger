name: Multibagger PIT Validation
on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 6"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-pit-validation
          path: reports/multibagger-pit-validation.json
