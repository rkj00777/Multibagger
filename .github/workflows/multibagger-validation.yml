name: Multibagger PIT Validation
on:
  push:
    branches: [main]
    paths: ["core/**", "multibagger/**", "scripts/**", "requirements.txt", ".github/workflows/multibagger-validation.yml"]
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 6"
concurrency:
  group: multibagger-pit-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Historical walk-forward needs timestamp-filtered NSE filings for dates
      # not yet covered by the local archive. The NSE PIT client now pages and
      # caches filings to avoid repeating the same network requests each date.
      MBE_ENABLE_DYNAMIC_PIT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_validation.py
      - run: PYTHONPATH=. python scripts/run_winner_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-pit-validation
          path: |
            reports/multibagger-pit-validation.json
            reports/multibagger-winner-audit.json
