name: Multibagger PIT Validation
on:
  push:
    branches: [main]
    paths: ["core/**", "multibagger/**", "scripts/**", "data/pit/**", "requirements.txt", ".github/workflows/multibagger-validation.yml"]
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 6"
concurrency:
  group: multibagger-pit-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MBE_ENABLE_DYNAMIC_PIT_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_validation.py
      - run: PYTHONPATH=. python scripts/run_winner_audit.py
      - name: Publish fail-closed validation report for the live promotion gate
        shell: bash
        run: |
          set -uo pipefail
          test -f reports/multibagger-pit-validation.json
          git config user.name "multibagger-bot"
          git config user.email "multibagger-bot@users.noreply.github.com"
          git add reports/multibagger-pit-validation.json reports/multibagger-winner-audit.json
          if git diff --cached --quiet; then
            echo "Validation report unchanged."
            exit 0
          fi
          git commit -m "Publish PIT validation gate report [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Concurrent report/data writer detected; retry $attempt."
            git fetch origin main || continue
            if ! git rebase origin/main; then
              if PYTHONPATH=. python scripts/merge_pit_conflicts.py; then
                GIT_EDITOR=true git rebase --continue || true
              else
                git rebase --abort || true
                break
              fi
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Could not publish validation report after retries. Production promotion remains blocked."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibagger-pit-validation
          path: |
            reports/multibagger-pit-validation.json
            reports/multibagger-winner-audit.json
          if-no-files-found: warn
