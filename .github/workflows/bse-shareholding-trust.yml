name: BSE Shareholding PIT Trust Probe
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/validate_bse_shareholding.py"
      - "requirements.txt"
      - ".github/workflows/bse-shareholding-trust.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe BSE iXBRL shareholding
        run: PYTHONPATH=. python scripts/validate_bse_shareholding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-shareholding-trust
          path: reports/bse-shareholding-trust.json
