name: Multibagger Live
on:
  workflow_dispatch:
  push:
    paths:
      - "multibagger/**"
      - "core/market_data.py"
      - "scripts/run_live.py"
      - ".github/workflows/multibagger-live.yml"
  schedule:
    - cron: "45 12 * * 1-5"
concurrency:
  group: multibagger-live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest exchange-first PIT fundamentals
        env:
          PIT_WORKERS: "6"
        run: |
          AS_OF="$(date -u +%F)"
          PYTHONPATH=. python scripts/ingest_pit.py --as-of "$AS_OF" --limit 500
      - name: Persist PIT evidence
        run: |
          git config user.name "multibagger-bot"
          git config user.email "multibagger-bot@users.noreply.github.com"
          git add data/pit
          if git diff --cached --quiet; then
            echo "No new PIT evidence."
          else
            git commit -m "Archive PIT evidence"
            git push
          fi
      - name: Run Multibagger
        run: |
          AS_OF="$(date -u +%F)"
          AS_OF="$AS_OF" PYTHONPATH=. python scripts/run_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibagger-live-report
          path: reports/multibagger-live.json
