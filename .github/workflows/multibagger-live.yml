name: Multibagger Live
on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 1-5"
concurrency:
  group: multibagger-live
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-live-report
          path: reports/multibagger-live.json
