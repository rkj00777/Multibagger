name: Blind Historical MBE Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/run_blind_historical_test.py",".github/workflows/blind-historical-mbe-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_blind_historical_test.py
      - uses: actions/upload-artifact@v4
        with: {name: blind-historical-mbe-test,path: reports/blind-historical-mbe-test.json}

# retrigger after test repair
