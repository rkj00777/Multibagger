name: BSE Shareholding PIT Incremental Ingest
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Universe offset for rotating batch"
        required: false
        default: "0"
  schedule:
    - cron: "30 18 * * 5"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest BSE iXBRL shareholding
        env:
          OFFSET: ${{ github.event.inputs.offset || '0' }}
        run: PYTHONPATH=. python scripts/ingest_bse_shareholding.py --limit 300 --offset "$OFFSET"
      - name: Persist PIT ownership data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pit/shareholding
          git diff --cached --quiet || git commit -m "Persist BSE shareholding PIT data"
          git push
